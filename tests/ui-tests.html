<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UI tests</title>
<style>
  body { margin: 0; padding: 24px; font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
         background: #f3eee2; color: #1b1a17; }
  h1 { margin: 0 0 12px; font-size: 22px; }
  #summary { position: sticky; top: 0; z-index: 2; padding: 16px 18px; margin-bottom: 16px;
             border: 3px solid #1b1a17; border-radius: 12px; background: #fffaf0;
             box-shadow: 4px 4px 0 #1b1a17; font-size: 24px; font-weight: 800; }
  #summary.pass { background: #dff3e6; }
  #summary.fail { background: #fbd9cf; }
  #list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; }
  .t { padding: 3px 6px; border-bottom: 1px dashed rgba(27,26,23,.18); }
  .ok { color: #1f7a4d; }
  .bad { color: #b3261e; font-weight: 700; }
  .detail { color: #8c8577; font-family: monospace; font-size: 11px; }
  iframe { position: fixed; left: -10000px; top: 0; width: 1440px; height: 1100px; border: 0; }
</style>
</head>
<body>
<h1>Git Interactive Tutorial · interface tests</h1>
<div id="summary">Waiting for the app to load…</div>
<div id="list"></div>
<iframe id="app" src="../index.html?fresh=1" title="app under test"></iframe>
<script>
(function () {
  var results = [];
  var started = false;
  var frame = document.getElementById('app');
  function check(name, cond, detail) {
    results.push({ name: name, ok: !!cond, detail: detail || '' });
  }
  function finish() {
    var pass = results.filter(function (r) { return r.ok; }).length;
    var fail = results.length - pass;
    var failures = results.filter(function (r) { return !r.ok; });
    var summary = document.getElementById('summary');
    summary.textContent = (fail === 0 ? 'All passed  ' : 'Failures  ') + pass + ' / ' + results.length +
      (fail ? '  —  ' + failures.map(function (r) { return r.name; }).join('; ') : '');
    summary.className = fail === 0 ? 'pass' : 'fail';
    document.title = (fail === 0 ? 'PASS ' : 'FAIL ') + pass + '/' + results.length;
    var list = document.getElementById('list');
    var sorted = results.slice().sort(function (a, b) {
      if (a.ok === b.ok) return 0;
      return a.ok ? 1 : -1;
    });
    list.innerHTML = sorted.map(function (r) {
      return '<div class="t"><span class="' + (r.ok ? 'ok' : 'bad') + '">' +
        (r.ok ? '✓' : '✗') + '</span> ' + r.name +
        (r.detail ? ' <span class="detail">' + String(r.detail).slice(0, 120) + '</span>' : '') +
        '</div>';
    }).join('');
  }
  function run() {
    if (started) return;
    started = true;
    var win = frame.contentWindow;
    var doc = frame.contentDocument;
    var G = win.GitPlayground;
    if (!G) { check('App loaded (debug API present)', false); finish(); return; }

    check('App loaded', !!doc.getElementById('card-title'));
    check('Sidebar has 8 chapters', doc.querySelectorAll('.chapter-toggle').length === 8);
    check('Card content is rendered', doc.getElementById('card-content').innerHTML.length > 50);
    check('Repository inspector is embedded in the data flow card',
      !!doc.querySelector('.flow-card .inspector-card'));
    check('Log card is the first bottom panel',
      doc.querySelector('.bottom-grid').firstElementChild.classList.contains('log-card'));
    check('Log footer shows the copyright and SJTU',
      /Copyright © 2026 Jacobus Laurence/.test(doc.getElementById('log-foot').textContent) &&
      /SJTU/.test(doc.getElementById('log-foot').textContent));
    check('Log side rail shows the session summary',
      /Session/.test(doc.getElementById('log-session').textContent) &&
      /Branch/.test(doc.getElementById('log-session').textContent) &&
      /Repository/.test(doc.getElementById('log-session').textContent));
    check('Initial state is not initialized', doc.getElementById('status-chip').textContent.indexOf('Not initialized') !== -1);

    G.execute('git init');
    check('Status shows main after git init', /main/.test(doc.getElementById('status-chip').textContent));
    G.execute('touch readme.md');
    G.setTab('working');
    check('readme.md appears in the working directory', !!doc.querySelector('.file-row[data-file="readme.md"]'));
    G.execute('echo "hello world" > readme.md');
    check('echo updates file content', G.state.workingDir['readme.md'].content === 'hello world');

    G.execute('git add readme.md');
    check('add switches the inspector to staging',
      doc.querySelector('.tab[data-tab="staging"]').classList.contains('is-active'));
    check('readme.md appears in the staging area', !!doc.querySelector('.file-row[data-zone="staging"]'));
    check('add arrow is lit',
      doc.querySelector('.flow-link[data-arrow="add"]').classList.contains('is-active'));

    G.execute('git commit -m "Add readme"');
    check('commit switches the inspector to local',
      doc.querySelector('.tab[data-tab="local"]').classList.contains('is-active'));
    check('a commit row appears locally', doc.querySelectorAll('.commit-row').length === 1);
    check('commit arrow is lit',
      doc.querySelector('.flow-link[data-arrow="commit"]').classList.contains('is-active'));
    check('the commit row shows HEAD', /HEAD/.test(doc.getElementById('inspector-body').textContent));

    var initIdx = -1;
    G.cards.forEach(function (c, i) { if (c.id === 'ch2-init') initIdx = i; });
    G.showCard(initIdx);
    G.execute('git init');
    check('the task card is marked complete', doc.getElementById('card-task').classList.contains('is-done'));
    check('completed records ch2-init', G.getCompleted()['ch2-init'] === true);
    check('sidebar task count updates', /1 \/ 16/.test(doc.getElementById('sidebar-count').textContent));

    G.setTab('working');
    G.openFile('readme.md', 'working');
    var fileDialog = doc.getElementById('file-dialog');
    check('file dialog opens', fileDialog.open === true);
    check('editor loads the file content', doc.getElementById('file-editor').value === 'hello world');
    doc.getElementById('file-editor').value = 'edited in dialog';
    doc.getElementById('file-save').click();
    check('saving the file takes effect', G.state.workingDir['readme.md'].content === 'edited in dialog');
    check('dialog closes after saving', fileDialog.open === false);
    var selection = doc.getElementById('inspector-selection');
    check('file name is shown beside the inspector tabs',
      selection.hidden === false &&
      doc.getElementById('inspector-selection-name').textContent === 'readme.md' &&
      doc.getElementById('inspector-selection-zone').textContent === 'Working Directory');
    var toasts = doc.querySelectorAll('#toast-stack .toast');
    var lastToast = toasts.length ? toasts[toasts.length - 1].textContent : '';
    check('toast does not repeat the file name', lastToast.indexOf('readme.md') === -1);

    G.openHelp();
    check('help dialog opens', doc.getElementById('help-dialog').open === true);
    check('help command list is populated', doc.querySelectorAll('.help-cmd').length > 20);
    doc.getElementById('help-dialog').close();

    G.openCommit(G.state.HEAD);
    check('commit details dialog opens', doc.getElementById('details-dialog').open === true);
    check('commit details include the commit header',
      /commit /.test(doc.getElementById('details-content').textContent));
    doc.getElementById('details-dialog').close();

    doc.getElementById('btn-new-file').click();
    check('new file dialog opens', doc.getElementById('prompt-dialog').open === true);
    doc.getElementById('prompt-input').value = 'notes.txt';
    doc.getElementById('prompt-ok').click();
    check('new file is created', !!G.state.workingDir['notes.txt']);

    win.confirm = function () { return true; };
    G.execute('touch todelete.txt');
    G.setTab('working');
    var row = doc.querySelector('.file-row[data-file="todelete.txt"]');
    check('row for the file to delete exists', !!row);
    if (row) row.querySelector('[data-action="delete"]').click();
    check('file deletion succeeds', !G.state.workingDir['todelete.txt']);

    G.setTab('working');
    var ev = new win.MouseEvent('contextmenu', {
      bubbles: true, cancelable: true, clientX: 200, clientY: 300
    });
    doc.getElementById('inspector-body').dispatchEvent(ev);
    check('context menu appears', doc.getElementById('ctx-menu').hidden === false);
    doc.body.click();

    var remoteTab = doc.querySelector('.tab[data-tab="remote"]');
    remoteTab.click();
    check('clicking the tab switches to remote', remoteTab.classList.contains('is-active'));
    var workingTab = doc.querySelector('.tab[data-tab="working"]');
    workingTab.click();
    check('clicking the tab switches back to working', workingTab.classList.contains('is-active'));

    var beforeTitle = doc.getElementById('card-title').textContent;
    doc.getElementById('card-next').click();
    check('next button works', doc.getElementById('card-title').textContent !== beforeTitle);
    doc.getElementById('card-prev').click();
    check('previous button returns to the original card', doc.getElementById('card-title').textContent === beforeTitle);

    var sideCard = doc.querySelector('.chapter-card[data-card="0"]');
    if (sideCard) {
      sideCard.click();
      check('sidebar click navigates', doc.getElementById('card-title').textContent === G.cards[0].title);
    } else {
      check('sidebar click navigates', false, 'could not find the button for the first card');
    }

    var terminalInput = doc.getElementById('terminal-input');
    terminalInput.value = 'git stas';
    terminalInput.dispatchEvent(new win.KeyboardEvent('keydown', {
      key: 'Tab', bubbles: true, cancelable: true
    }));
    check('Tab completes subcommands', terminalInput.value === 'git stash ');

    terminalInput.value = 'git add rea';
    terminalInput.dispatchEvent(new win.KeyboardEvent('keydown', {
      key: 'Tab', bubbles: true, cancelable: true
    }));
    check('Tab completes file names', terminalInput.value === 'git add readme.md ');

    terminalInput.value = 'git status';
    var submit = new win.Event('submit', { bubbles: true, cancelable: true });
    doc.getElementById('terminal-form').dispatchEvent(submit);
    check('terminal form executes commands',
      /On branch/.test(doc.getElementById('terminal-output').textContent));
    check('terminal input is cleared', terminalInput.value === '');
    terminalInput.dispatchEvent(new win.KeyboardEvent('keydown', {
      key: 'ArrowUp', bubbles: true, cancelable: true
    }));
    check('↑ recalls command history', terminalInput.value === 'git status');

    var chapter2 = doc.querySelector('.chapter-toggle[data-chapter="2"]');
    if (chapter2) {
      var wasOpen = chapter2.classList.contains('is-open');
      chapter2.click();
      var chapter2After = doc.querySelector('.chapter-toggle[data-chapter="2"]');
      check('chapters can collapse and expand',
        chapter2After && chapter2After.classList.contains('is-open') !== wasOpen);
    } else {
      check('chapters can collapse and expand', false, 'could not find the chapter 2 button');
    }

    finish();
  }

  window.addEventListener('load', function () {
    // The parent load event always fires after the iframe document has loaded;
    // run the tests synchronously so headless screenshots capture the final state.
    var win = frame.contentWindow;
    if (win && win.GitPlayground) run();
    else { check('App loaded (debug API present)', false); finish(); }
  });
})();
</script>
</body>
</html>
