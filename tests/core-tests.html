<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Core tests</title>
<style>
  body { margin: 0; padding: 24px; font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
         background: #f3eee2; color: #1b1a17; }
  h1 { margin: 0 0 12px; font-size: 22px; }
  #summary { position: sticky; top: 0; z-index: 2; padding: 16px 18px; margin-bottom: 16px;
             border: 3px solid #1b1a17; border-radius: 12px; background: #fffaf0;
             box-shadow: 4px 4px 0 #1b1a17; font-size: 26px; font-weight: 800; }
  #summary.pass { background: #dff3e6; }
  #summary.fail { background: #fbd9cf; }
  #list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; }
  .t { padding: 3px 6px; border-bottom: 1px dashed rgba(27,26,23,.18); }
  .ok { color: #1f7a4d; }
  .bad { color: #b3261e; font-weight: 700; }
  .detail { color: #8c8577; font-family: monospace; font-size: 11px; }
</style>
</head>
<body>
<h1>Git Interactive Tutorial · core simulator tests</h1>
<div id="summary">Running…</div>
<div id="list"></div>

<script src="../js/state.js"></script>
<script src="../js/parser.js"></script>
<script src="../js/commands.js"></script>
<script src="../js/tutorials.js"></script>
<script>
(function () {
  var GT = window.GitTutorial;
  var results = [];
  function check(name, cond, detail) {
    results.push({ name: name, ok: !!cond, detail: detail || '' });
  }
  function mk() { var s = new GT.GitState(); return { s: s, p: new GT.Parser(s, GT.commands) }; }
  function run(p, c) { return p.parse(c); }
  function out(p, c) { var r = run(p, c); return r ? String(r.output) : ''; }
  function keys(o) { return Object.keys(o || {}); }

  // 1. Snapshot accumulation / untracked files
  (function () {
    var t = mk();
    run(t.p, 'git init'); run(t.p, 'touch a.txt'); run(t.p, 'git add a.txt'); run(t.p, 'git commit -m c1');
    run(t.p, 'touch b.txt'); run(t.p, 'git add b.txt'); run(t.p, 'git commit -m c2');
    check('Snapshot accumulation: c2 keeps a.txt', 'a.txt' in t.s.commits[1].files);
    check('Snapshot accumulation: c2 contains b.txt', 'b.txt' in t.s.commits[1].files);

    var u = mk();
    run(u.p, 'git init'); run(u.p, 'touch a.txt'); run(u.p, 'git add a.txt'); run(u.p, 'git commit -m c1');
    run(u.p, 'touch b.txt'); run(u.p, 'echo "v2" > a.txt'); run(u.p, 'git add a.txt'); run(u.p, 'git commit -m c2');
    check('Commit does not delete untracked files', 'b.txt' in u.s.workingDir);
    check('Untracked file stays new after commit', u.s.workingDir['b.txt'].status === 'new');
    check('Commit does not put untracked files into the snapshot', !('b.txt' in u.s.commits[1].files));

    var v = mk();
    run(v.p, 'git init'); run(v.p, 'echo "v1" > a.txt'); run(v.p, 'git add .'); run(v.p, 'git commit -m c1');
    run(v.p, 'echo "v2" > a.txt'); run(v.p, 'touch b.txt'); run(v.p, 'git add b.txt'); run(v.p, 'git commit -m c2');
    check('Unstaged edit stays modified after commit', v.s.workingDir['a.txt'].status === 'modified');
    check('Unstaged edit is not committed', v.s.commits[1].files['a.txt'].content === 'v1');
  })();

  // 2. reset revision parsing / modes
  (function () {
    var t = mk();
    run(t.p, 'git init');
    for (var i = 1; i <= 3; i++) { run(t.p, 'touch f' + i); run(t.p, 'git add .'); run(t.p, 'git commit -m c' + i); }
    check('reset --hard HEAD~1 succeeds', run(t.p, 'git reset --hard HEAD~1').success);
    check('reset --hard returns to c2', t.s._getCommit(t.s.HEAD).message === 'c2');
    check('reset --soft stages content', run(t.p, 'git reset --soft HEAD~1').success && keys(t.s.staging).length > 0);
    check('reset with no arguments defaults to HEAD', run(t.p, 'git reset').success);
    check('reset with a short hash', run(t.p, 'git reset --hard ' + t.s.commits[0].hash.substring(0, 5)).success);
    check('reset past the root fails', !run(t.p, 'git reset --hard HEAD~99').success);

    var u = mk();
    run(u.p, 'git init'); run(u.p, 'touch a'); run(u.p, 'git add .'); run(u.p, 'git commit -m c1');
    run(u.p, 'touch untracked.txt'); run(u.p, 'git reset --soft HEAD~1');
    check('reset --soft does not stage untracked files', !('untracked.txt' in u.s.staging));

    ['--soft', '--mixed', '--hard'].forEach(function (mode) {
      var z = mk();
      run(z.p, 'git init');
      for (var i = 1; i <= 3; i++) { run(z.p, 'touch f' + i); run(z.p, 'git add .'); run(z.p, 'git commit -m c' + i); }
      check('reset ' + mode + ' works', run(z.p, 'git reset ' + mode + ' HEAD~1').success);
    });
  })();

  // 3. rm / restore / rm --cached
  (function () {
    var t = mk();
    run(t.p, 'git init'); run(t.p, 'touch z.txt'); run(t.p, 'git add .'); run(t.p, 'git commit -m c1');
    run(t.p, 'git rm z.txt');
    check('status shows deleted after rm', /deleted:\s+z\.txt/.test(out(t.p, 'git status')));
    run(t.p, 'git commit -m del');
    check('file disappears after rm + commit', !('z.txt' in t.s.workingDir));
    check('working tree is clean after rm + commit', /nothing to commit/.test(out(t.p, 'git status')));

    var u = mk();
    run(u.p, 'git init'); run(u.p, 'touch keep.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m c1');
    run(u.p, 'git rm keep.txt'); run(u.p, 'git restore keep.txt');
    check('restore recovers the file after rm', 'keep.txt' in u.s.workingDir);
    check('restored file matches HEAD content', u.s.workingDir['keep.txt'].status === 'committed');

    var v = mk();
    run(v.p, 'git init'); run(v.p, 'touch untracked.txt');
    check('rm on an untracked file fails', !run(v.p, 'git rm untracked.txt').success);
    check('untracked file is not deleted by rm', 'untracked.txt' in v.s.workingDir);

    var w = mk();
    run(w.p, 'git init'); run(w.p, 'echo "secret" > .env'); run(w.p, 'git add .'); run(w.p, 'git commit -m c1');
    run(w.p, 'git rm --cached .env');
    check('rm --cached keeps the working file', ' .env'.trim() in w.s.workingDir);
    run(w.p, 'git commit -m untrack');
    check('file stays in the working directory after rm --cached + commit', '.env' in w.s.workingDir);
    check('file becomes untracked after rm --cached + commit', w.s.workingDir['.env'].status === 'new');
  })();

  // 4. Commit message parsing
  (function () {
    var cases = [
      ['git commit -m hello world foo', 'hello world foo'],
      ['git commit -m "hello world"', 'hello world'],
      ['git commit -m"hello world"', 'hello world'],
      ['git commit --message "hello there"', 'hello there'],
      ['git commit --message=hello there', 'hello'],
      ['git commit --message="hello there"', 'hello there']
    ];
    cases.forEach(function (c) {
      var t = mk();
      run(t.p, 'git init'); run(t.p, 'touch q.txt'); run(t.p, 'git add .');
      var r = run(t.p, c[0]);
      check('commit message: ' + c[0], r.success && t.s.commits[0] && t.s.commits[0].message === c[1],
        t.s.commits[0] ? t.s.commits[0].message : 'no commit');
    });
  })();

  // 5. add / glob / diff
  (function () {
    var t = mk();
    run(t.p, 'git init'); run(t.p, 'touch a.py'); run(t.p, 'touch b.py'); run(t.p, 'touch c.txt');
    check('git add *.py succeeds', run(t.p, 'git add *.py').success);
    check('wildcard stages only .py files', 'a.py' in t.s.staging && 'b.py' in t.s.staging && !('c.txt' in t.s.staging));

    var u = mk();
    run(u.p, 'git init'); run(u.p, 'echo "l1" > d.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m c1');
    run(u.p, 'echo "l2" > d.txt');
    var d = out(u.p, 'git diff');
    check('diff marks removed lines', /^-l1$/m.test(d), d);
    check('diff marks added lines', /^\+l2$/m.test(d), d);

    var v = mk();
    run(v.p, 'git init'); run(v.p, 'echo "v1" > f.txt'); run(v.p, 'git add .'); run(v.p, 'git commit -m c1');
    v.s.deleteFile('f.txt');
    check('git diff shows an unstaged deletion', /-v1/.test(out(v.p, 'git diff')));
    run(v.p, 'git add .');
    check('working-tree diff is empty after staging the deletion', out(v.p, 'git diff').trim() === '');
    check('git diff --staged shows the deletion', /-v1/.test(out(v.p, 'git diff --staged')));
  })();

  // 6. merge conflicts / auto-merge / fast-forward
  (function () {
    function conflictState() {
      var t = mk();
      run(t.p, 'git init');
      run(t.p, 'echo "line1" > c.txt'); run(t.p, 'git add .'); run(t.p, 'git commit -m base');
      run(t.p, 'git checkout -b feat');
      run(t.p, 'echo "FEAT" > c.txt'); run(t.p, 'git add .'); run(t.p, 'git commit -m featc');
      run(t.p, 'git checkout main');
      run(t.p, 'echo "MAIN" > c.txt'); run(t.p, 'git add .'); run(t.p, 'git commit -m mainc');
      return t;
    }
    var t = conflictState();
    var r = run(t.p, 'git merge feat');
    check('merge fails on conflict', !r.success);
    check('conflict is recorded', t.s.mergeConflict && t.s.mergeConflict.length === 1);
    var content = t.s.workingDir['c.txt'].content;
    check('conflict markers are complete', /<<<<<<< HEAD/.test(content) && /=======/.test(content) && />>>>>>> feat/.test(content));
    check('conflict keeps both sides', content.indexOf('MAIN') !== -1 && content.indexOf('FEAT') !== -1);
    check('commit is blocked during a conflict', !run(t.p, 'git commit -m x').success);
    check('checkout is blocked during a conflict', !run(t.p, 'git checkout feat').success);
    run(t.p, 'echo "RESOLVED" > c.txt'); run(t.p, 'git add c.txt');
    check('conflicts clear after add', t.s.mergeConflict.length === 0);
    var cr = run(t.p, 'git commit -m resolve');
    check('commit succeeds after resolution', cr.success);
    check('merge commit records mergeParent', !!t.s.commits[t.s.commits.length - 1].mergeParent);

    var u = mk();
    run(u.p, 'git init'); run(u.p, 'echo "base" > shared.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m base');
    run(u.p, 'git checkout -b feat'); run(u.p, 'touch featonly.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m f');
    run(u.p, 'git checkout main'); run(u.p, 'touch mainonly.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m m');
    check('merge succeeds with different files', run(u.p, 'git merge feat').success);
    check('merge keeps files from both sides', 'featonly.txt' in u.s.workingDir && 'mainonly.txt' in u.s.workingDir);

    var v = mk();
    run(v.p, 'git init'); run(v.p, 'touch a.txt'); run(v.p, 'git add .'); run(v.p, 'git commit -m c1');
    run(v.p, 'git checkout -b feat'); run(v.p, 'touch b.txt'); run(v.p, 'git add .'); run(v.p, 'git commit -m c2');
    run(v.p, 'git checkout main');
    var fr = run(v.p, 'git merge feat');
    check('fast-forward merge', fr.success && /Fast-forward/.test(fr.output));
  })();

  // 7. revert / cherry-pick / rebase
  (function () {
    var t = mk();
    run(t.p, 'git init'); run(t.p, 'echo "v1" > f.txt'); run(t.p, 'git add .'); run(t.p, 'git commit -m c1');
    run(t.p, 'echo "v2" > f.txt'); run(t.p, 'git add .'); run(t.p, 'git commit -m c2');
    check('revert succeeds', run(t.p, 'git revert ' + t.s.HEAD).success);
    check('revert restores the old content', t.s.workingDir['f.txt'].content === 'v1');

    var u = mk();
    run(u.p, 'git init'); run(u.p, 'touch base.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m base');
    run(u.p, 'git checkout -b feat'); run(u.p, 'echo "feat" > feat.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m featc');
    var fh = u.s.HEAD;
    run(u.p, 'git checkout main'); run(u.p, 'touch main.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m mainc');
    check('cherry-pick succeeds', run(u.p, 'git cherry-pick ' + fh).success);
    check('cherry-pick brings the file over', 'feat.txt' in u.s.workingDir);

    var v = mk();
    run(v.p, 'git init'); run(v.p, 'touch base.txt'); run(v.p, 'git add .'); run(v.p, 'git commit -m base');
    run(v.p, 'git checkout -b topic'); run(v.p, 'touch topiconly.txt'); run(v.p, 'git add .'); run(v.p, 'git commit -m topic');
    run(v.p, 'git checkout main'); run(v.p, 'touch mainonly.txt'); run(v.p, 'git add .'); run(v.p, 'git commit -m main');
    check('rebase succeeds', run(v.p, 'git rebase topic').success);
    check('rebase keeps files from both sides', 'topiconly.txt' in v.s.workingDir && 'mainonly.txt' in v.s.workingDir);
    check('rebasing onto self is an error', !run(v.p, 'git rebase main').success);

    var w = mk();
    run(w.p, 'git init'); w.s.createFile('f.txt', 'l1\nl2\nl3'); run(w.p, 'git add .'); run(w.p, 'git commit -m base');
    run(w.p, 'git checkout -b feature'); w.s.modifyFile('f.txt', 'l1\nFEATURE\nl3');
    run(w.p, 'git add .'); run(w.p, 'git commit -m feat');
    run(w.p, 'git checkout main'); w.s.modifyFile('f.txt', 'l1\nMAIN\nl3');
    run(w.p, 'git add .'); run(w.p, 'git commit -m mainc'); run(w.p, 'git checkout feature');
    var rr = run(w.p, 'git rebase main');
    check('rebase aborts on conflict', !rr.success);
    check('rebase conflict is recorded', w.s.mergeConflict && w.s.mergeConflict.length > 0);
    check('rebase does not commit conflict markers',
      (w.s._getCommit(w.s.HEAD).files['f.txt'].content || '').indexOf('<<<<<<<') === -1);
  })();

  // 8. Branches / detached HEAD
  (function () {
    var t = mk();
    run(t.p, 'git init'); run(t.p, 'touch x.txt'); run(t.p, 'git add .'); run(t.p, 'git commit -m c1');
    var h1 = t.s.HEAD;
    run(t.p, 'touch y.txt'); run(t.p, 'git add .'); run(t.p, 'git commit -m c2');
    run(t.p, 'git checkout ' + h1);
    check('detached HEAD has currentBranch null', t.s.currentBranch === null);
    run(t.p, 'echo "det" > x.txt'); run(t.p, 'git add .');
    check('detached HEAD can commit', run(t.p, 'git commit -m detached').success);
    check('detached HEAD does not move main', t.s.branches.main !== t.s.HEAD);

    var u = mk();
    run(u.p, 'git init'); run(u.p, 'touch a.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m c1');
    run(u.p, 'git checkout -b feat'); run(u.p, 'touch b.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m c2');
    run(u.p, 'git checkout main');
    check('branch -d refuses an unmerged branch', !run(u.p, 'git branch -d feat').success);
    check('branch -D force-deletes', run(u.p, 'git branch -D feat').success);

    var v = mk();
    run(v.p, 'git init'); run(v.p, 'touch base.txt'); run(v.p, 'git add .'); run(v.p, 'git commit -m c1');
    run(v.p, 'git checkout -b dev'); run(v.p, 'touch dev.txt'); run(v.p, 'git add .'); run(v.p, 'git commit -m c2');
    run(v.p, 'git checkout main'); run(v.p, 'touch main.txt'); run(v.p, 'git add .'); run(v.p, 'git commit -m c3');
    run(v.p, 'git merge dev');
    check('merged branch can be deleted with branch -d', run(v.p, 'git branch -d dev').success);
  })();

  // 9. tag / stash
  (function () {
    var t = mk();
    run(t.p, 'git init'); run(t.p, 'touch x'); run(t.p, 'git add .'); run(t.p, 'git commit -m c1');
    run(t.p, 'git tag v1');
    check('tag creates and lists', out(t.p, 'git tag').indexOf('v1') !== -1);
    check('tag -d deletes', run(t.p, 'git tag -d v1').success && !('v1' in t.s.tags));
    check('invalid tag name is rejected', !run(t.p, 'git tag "bad name"').success);

    var u = mk();
    run(u.p, 'git init'); run(u.p, 'touch x'); run(u.p, 'git add .'); run(u.p, 'git commit -m c1');
    run(u.p, 'echo "1" > x'); run(u.p, 'git stash save one');
    run(u.p, 'echo "2" > x'); run(u.p, 'git stash save two');
    check('stash list shows newest first', /stash@\{0\}: two/.test(out(u.p, 'git stash list').split('\n')[0]));
    check('stash apply keeps the entry', run(u.p, 'git stash apply').success && u.s.stash.length === 2);
    check('stash apply restores content', u.s.workingDir['x'].content === '2');
    check('stash pop succeeds', run(u.p, 'git stash pop').success);
    check('stash pop removes one entry', u.s.stash.length === 1);
  })();

  // 10. pull / push
  (function () {
    var t = mk();
    run(t.p, 'git init'); run(t.p, 'echo "v1" > a.txt'); run(t.p, 'git add .'); run(t.p, 'git commit -m c1');
    run(t.p, 'git push origin main');
    run(t.p, 'echo "remote" > a.txt'); run(t.p, 'git add .'); run(t.p, 'git commit -m c2');
    run(t.p, 'git push origin main'); run(t.p, 'git reset --hard HEAD~1');
    t.s.createFile('untracked.txt', 'keep'); t.s.modifyFile('a.txt', 'LOCAL DIRTY');
    var r = run(t.p, 'git pull origin main');
    check('pull refuses to overwrite uncommitted changes', !r.success);
    check('changes survive a rejected pull', t.s.workingDir['a.txt'].content === 'LOCAL DIRTY');
    check('untracked files survive a rejected pull', 'untracked.txt' in t.s.workingDir);

    var u = mk();
    run(u.p, 'git init'); run(u.p, 'echo "x" > f.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m c1');
    run(u.p, 'git push origin main'); run(u.p, 'echo "y" > f.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m c2');
    run(u.p, 'git push origin main');
    var tip = u.s.remote.branches.main;
    run(u.p, 'git reset --hard HEAD~1'); run(u.p, 'echo "z" > f.txt'); run(u.p, 'git add .'); run(u.p, 'git commit -m diverged');
    check('push rejects a non-fast-forward', !run(u.p, 'git push origin main').success);
    check('remote ref is unchanged after a rejected push', u.s.remote.branches.main === tip);

    var v = mk();
    run(v.p, 'git init'); run(v.p, 'touch a'); run(v.p, 'git add .'); run(v.p, 'git commit -m c1');
    run(v.p, 'git branch feature'); run(v.p, 'git checkout feature'); run(v.p, 'touch b'); run(v.p, 'git add .'); run(v.p, 'git commit -m c2');
    var fh = v.s.HEAD; run(v.p, 'git checkout main'); run(v.p, 'git push origin feature');
    check('push a named branch', v.s.remote.branches.feature === fh);

    var w = mk();
    run(w.p, 'git init'); run(w.p, 'touch base.txt'); run(w.p, 'git add .'); run(w.p, 'git commit -m c1');
    run(w.p, 'git checkout -b feat'); run(w.p, 'touch feat.txt'); run(w.p, 'git add .'); run(w.p, 'git commit -m c2');
    run(w.p, 'git checkout main'); run(w.p, 'touch main.txt'); run(w.p, 'git add .'); run(w.p, 'git commit -m c3');
    run(w.p, 'git merge feat'); run(w.p, 'git push origin main');
    var remoteHashes = {};
    w.s.remote.commits.forEach(function (c) { remoteHashes[c.hash] = true; });
    var allPushed = w.s.commits.every(function (c) { return remoteHashes[c.hash]; });
    check('push includes commits from the merged branch', allPushed);
  })();

  // 11. clone
  (function () {
    var t = mk();
    run(t.p, 'git init'); run(t.p, 'git config --global user.name "someone"');
    run(t.p, 'git clone git@github.com:user/repo.git');
    check('clone records the remote URL', t.s.remote.url === 'git@github.com:user/repo.git');
    check('clone keeps global config', t.s.config.global['user.name'] === 'someone');
    check('clone has sample files', 'README.md' in t.s.workingDir);
    check('remote -v is readable after clone', /origin/.test(out(t.p, 'git remote -v')));
  })();

  // 12. Empty-file semantics / tutorial data
  (function () {
    var t = mk();
    run(t.p, 'git init'); t.s.createFile('e.txt', '');
    run(t.p, 'git add .'); run(t.p, 'git commit -m c1');
    check('show displays a newly added empty file', out(t.p, 'git show HEAD').indexOf('diff --git') !== -1);

    check('there are 36 tutorial cards', GT.tutorials.length === 36);
    check('there are 8 chapters', GT.chapters.length === 8);
    var taskCount = GT.tutorials.filter(function (c) { return !!c.task; }).length;
    check('task card count', taskCount === 16, String(taskCount));
    var bad = [];
    GT.tutorials.forEach(function (c) {
      var m = c.task && c.task.prompt && c.task.prompt.match(/<code>[^<]+<\/code>/g);
      if (c.task && (!m || !m.length)) bad.push(c.id);
    });
    check('every task card contains a <code> command', bad.length === 0, bad.join(','));
    check('fetch card is present', GT.tutorials.some(function (c) { return c.id === 'ch5-fetch'; }));
    check('merge card is present', GT.tutorials.some(function (c) { return c.id === 'ch4-merge'; }));
  })();

  // Summary rendering
  var pass = results.filter(function (r) { return r.ok; }).length;
  var fail = results.length - pass;
  var failures = results.filter(function (r) { return !r.ok; });
  var summary = document.getElementById('summary');
  summary.textContent = (fail === 0 ? 'All passed  ' : 'Failures  ') + pass + ' / ' + results.length +
    (fail ? '  —  ' + failures.map(function (r) { return r.name; }).join('; ') : '');
  summary.className = fail === 0 ? 'pass' : 'fail';
  document.title = (fail === 0 ? 'PASS ' : 'FAIL ') + pass + '/' + results.length;
  var list = document.getElementById('list');
  var sorted = results.slice().sort(function (a, b) {
    if (a.ok === b.ok) return 0;
    return a.ok ? 1 : -1;
  });
  list.innerHTML = sorted.map(function (r) {
    return '<div class="t"><span class="' + (r.ok ? 'ok' : 'bad') + '">' +
      (r.ok ? '✓' : '✗') + '</span> ' + r.name +
      (r.detail ? ' <span class="detail">' + String(r.detail).slice(0, 120) + '</span>' : '') +
      '</div>';
  }).join('');
})();
</script>
</body>
</html>
